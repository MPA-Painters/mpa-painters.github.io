<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPA clip: el Método MPA</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: radial-gradient(120% 90% at 85% 10%, var(--navy) 0%, var(--navy-3) 45%, var(--navy-4) 100%); color: #fff; font-family: var(--font-body); }
  .clip { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; overflow: hidden; }
  .clip-glow { position: absolute; width: 70vmin; height: 70vmin; border-radius: 50%; filter: blur(80px); opacity: .3; }
  .clip-glow.a { background: var(--sky); top: -25vmin; right: -15vmin; }
  .clip-glow.b { background: var(--red); bottom: -35vmin; left: -20vmin; }
  .clip-inner { position: relative; width: min(92vw, 1600px); height: 86vh; display: grid; gap: 3vmin; align-items: center; }
  .clip-logo { position: absolute; top: 0; left: 0; height: 12vmin; }
  .clip-footer { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; font-family: var(--font-display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 2.2vmin; color: var(--sky); }
  .clip h1 { color: #fff; font-size: 8vmin; line-height: 1; letter-spacing: -.03em; margin: 0 0 2vmin; }
  .clip h1 .accent { color: var(--sky); }
  .clip .lead { color: rgba(255,255,255,.88); font-size: 3vmin; max-width: 40ch; }
  /* landscape: two columns; portrait: stacked */
  @media (min-aspect-ratio: 1/1) { .clip-inner { grid-template-columns: 1fr 1fr; padding-top: 14vmin; } }
  @media (max-aspect-ratio: 1/1) { .clip-inner { grid-template-rows: auto 1fr; padding-top: 16vmin; } .clip h1 { font-size: 9vmin; } }
</style>
</head>
<body>
<div class="clip">
  <div class="clip-glow a"></div><div class="clip-glow b"></div>
  <div class="clip-inner">
    <img class="clip-logo" src="/img/logo-white.png" alt="MPA Painters">
<div>
  <h1>El Método MPA. <span class="accent">Cada piso. Cada edificio.</span></h1>
  <p class="lead">Preparación. Primer a pistola. Acabados a mano. Tres recorridos. Entrega firmada.</p>
</div>
<div><svg class="scene-way" data-step="0" data-autoplay="2600" viewBox="0 0 640 520" role="img" aria-label="Diagrama animado del Método MPA: preparación, primer, acabados, recorridos de calidad, entrega">
  <!-- room -->
  <rect x="40" y="40" width="560" height="360" rx="10" fill="#0B3A68"/>
  <rect x="40" y="400" width="560" height="26" rx="6" fill="#072A4D"/>
  <!-- wall panels (prep = grey) -->
  <g class="layer prep">
    <rect x="70" y="70" width="500" height="300" rx="6" fill="#274B70"/>
    <path d="M90 120 l60 40 M420 90 l70 60 M120 300 l90 -30" stroke="#3B6289" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- primer sweep -->
  <g class="layer primer"><rect x="70" y="70" width="500" height="300" rx="6" fill="#9DDBF1"/></g>
  <!-- finish sweep -->
  <g class="layer finish"><rect x="70" y="70" width="500" height="300" rx="6" fill="#F7FBFE"/></g>
  <!-- tools -->
  <g class="tool tool-prep" transform="translate(300 250)">
    <rect x="-70" y="-14" width="140" height="28" rx="6" fill="#C3202B"/>
    <rect x="-40" y="14" width="80" height="10" rx="3" fill="#8F1119"/>
  </g>
  <g class="tool tool-spray" transform="translate(300 250)">
    <path d="M-30 -10 h40 l20 -14 v48 l-20 -14 h-40 z" fill="#C3202B"/>
    <rect x="-30" y="14" width="18" height="50" rx="4" fill="#8F1119"/>
    <path d="M40 0 h90 M40 -12 h70 M40 12 h70" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  </g>
  <g class="tool tool-roller" transform="translate(300 250)">
    <rect x="-60" y="-16" width="120" height="32" rx="14" fill="#0F487F"/>
    <rect x="-60" y="-16" width="120" height="32" rx="14" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M60 0 h40 v60" stroke="#C3202B" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- QC marks -->
  <g class="layer qc" fill="none" stroke="#C3202B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 150 l18 18 l36 -40"/>
    <path d="M300 130 l18 18 l36 -40"/>
    <path d="M460 170 l18 18 l36 -40"/>
    <path d="M220 300 l18 18 l36 -40"/>
    <path d="M400 290 l18 18 l36 -40"/>
  </g>
  <!-- turnover board -->
  <g class="layer plan">
    <rect x="110" y="110" width="420" height="220" rx="10" fill="#0F487F" stroke="#9DDBF1" stroke-width="3"/>
    <text x="130" y="148" font-family="Outfit, sans-serif" font-weight="700" font-size="20" fill="#9DDBF1">ENTREGA · EDIF. 3 · PISO 2</text>
    <g fill="#9DDBF1" font-family="DM Sans, sans-serif" font-size="14">
      <text x="130" y="185">RECORRIDO LÍDER DE CUADRILLA</text><rect class="bar" x="300" y="172" width="200" height="16" rx="8" fill="#9DDBF1"/>
      <text x="130" y="215">RECORRIDO DEL PM</text><rect class="bar" x="300" y="202" width="200" height="16" rx="8" fill="#9DDBF1"/>
      <text x="130" y="245">PENDIENTES CERRADOS</text><rect class="bar" x="300" y="232" width="200" height="16" rx="8" fill="#fff"/>
      <text x="130" y="275">RECORRIDO CON CLIENTE FIRMADO</text><rect class="bar" x="300" y="262" width="200" height="16" rx="8" fill="#C3202B"/>
      <text x="130" y="305">SIGUIENTE: PISO 3</text><rect class="bar" x="300" y="292" width="120" height="16" rx="8" fill="#3B6289"/>
    </g>
  </g>
  <!-- step labels -->
  <text class="label l0" x="60" y="480">01 · PREPARACIÓN</text>
  <text class="label l1" x="60" y="480">02 · PRIMER, A PISTOLA</text>
  <text class="label l2" x="60" y="480">03 · ACABADOS, A MANO</text>
  <text class="label l3" x="60" y="480">04 · TRES RECORRIDOS ANTES DE LA ENTREGA</text>
  <text class="label l4" x="60" y="480">05 · ENTREGA FIRMADA</text>
</svg></div>
    <div class="clip-footer"><span>mpapainters.com</span><span>NJ · NY · PA</span></div>
  </div>
</div>
<script src="/js/scenes.js"></script>
</body>
</html>
